name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the Go and golangci-lint versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: mise run check
      - run: go build ./...
      - run: go test ./...
