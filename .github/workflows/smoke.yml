name: Smoke

# Verifies the released binary installs and runs via mise's github backend on
# every supported OS — i.e. that the per-platform release assets and the
# binary resolve on Linux/macOS/Windows, not just where it was built.

# The release workflow calls this after publishing. A `release: published`
# trigger would never fire, since GitHub starts no workflow from an event that
# GITHUB_TOKEN caused, and that token is what creates the release.
on:
  workflow_call:
    inputs:
      version:
        description: Version to test (e.g. v0.7.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to test (0.7.0 or later, or latest)
        default: latest

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: Install and run az-devops-token
        shell: bash
        run: |
          ver="${{ inputs.version || 'latest' }}"
          ver="${ver#v}"
          mise use -g "github:energyworldnet/az-devops-token@${ver}"
          # status never writes a token, unlike print, so this log stays safe
          # even if the runner ever holds a login. With none, it reports
          # "not signed in" and exits 1, which proves the asset match, that
          # the binary runs on this OS, and that the release baked in the app
          # IDs (without them it reports missing configuration instead).
          out="$(mise exec -- az-devops-token status 2>&1 || true)"
          echo "output: $out"
          echo "$out" | grep -q "not signed in" || { echo "::error::binary did not resolve or run"; exit 1; }
