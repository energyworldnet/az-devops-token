name: Smoke

# Verifies the released binary installs and runs via mise's github backend on
# every supported OS — i.e. that the per-platform release assets and the
# binary resolve on Linux/macOS/Windows, not just where it was built.

# The release workflow calls this after publishing. A `release: published`
# trigger would never fire, since GitHub starts no workflow from an event that
# GITHUB_TOKEN caused, and that token is what creates the release.
on:
  workflow_call:
    inputs:
      version:
        description: Version to test (e.g. v0.7.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to test (e.g. 0.2.0, or latest)
        default: latest

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: Install and run az-devops-token
        shell: bash
        run: |
          ver="${{ inputs.version || 'latest' }}"
          ver="${ver#v}"
          mise use -g "github:energyworldnet/az-devops-token@${ver}"
          # No login on the runner, so the binary prints its own "no token"
          # message and exits 0 — which still proves the asset match, the
          # binary's resolution, and that it runs on this OS.
          out="$(mise exec -- az-devops-token print 2>&1 || true)"
          echo "output: $out"
          echo "$out" | grep -q "no token" || { echo "::error::binary did not resolve or run"; exit 1; }
