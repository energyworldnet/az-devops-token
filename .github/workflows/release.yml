name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile
        # Bake the Entra public-client app IDs (from repo variables) and the
        # release tag into the binary.
        env:
          LDFLAGS: >-
            -s -w
            -X main.clientID=${{ vars.AZURE_CLIENT_ID }}
            -X main.tenantID=${{ vars.AZURE_TENANT_ID }}
            -X main.version=${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; out="dist/az-devops-token-$os-$arch"
            [ "$os" = windows ] && out="$out.exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "$out" .
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
