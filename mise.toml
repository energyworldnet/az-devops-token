[tools]
"aqua:golangci/golangci-lint" = "2.15"
go = "1.27"

[tasks.build]
description = "Build for the host platform into dist/"
run = "go build -trimpath -ldflags '-s -w' -o dist/az-devops-token ."

[tasks.check]
description = "Lint and format-check"
run = ["golangci-lint run", "golangci-lint fmt --diff"]
